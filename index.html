<script>
    let isHost = false; let peer = null; let hostConnection = null;
    let playerConnections = []; let localPlayerId = null; let roomCode = '';

    const peerConfig = {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' }
        ]
      },
      debug: 2 
    };

    let state = {
      roomCode: '', phase: 'LOBBY', players: [],
      moderatorId: null, mafiaId: null, mafiaTarget: null,
      votes: {}, announcement: 'Waiting for players to join...'
    };

    function updateStatus(msg, isSuccess = false) {
      const el = document.getElementById('connection-status');
      if (!el) return;
      el.innerText = msg;
      if (isSuccess) el.style.color = 'var(--accent-green)';
      else if (msg.includes('🔴') || msg.includes('Error') || msg.includes('⚠️')) el.style.color = 'var(--accent-red)';
      else el.style.color = 'var(--text-muted)';
    }

    function toggleAudio() {
      const audio = document.getElementById('bg-music');
      const btn = document.getElementById('mute-btn');
      if (audio.muted) { audio.muted = false; btn.innerText = '🔊 Mute Music'; } 
      else { audio.muted = true; btn.innerText = '🔇 Unmute Music'; }
    }

    function switchRole(role) {
      document.getElementById('view-landing').style.display = 'none';
      document.getElementById('view-screen').classList.add('hidden');
      document.getElementById('view-moderator').classList.add('hidden');
      document.getElementById('view-player').classList.add('hidden');

      if (role === 'screen') {
        isHost = true;
        document.getElementById('view-screen').classList.remove('hidden');
        const bgAudio = document.getElementById('bg-music');
        bgAudio.volume = 0.4;
        bgAudio.play().catch(e => console.log("Audio blocked until interaction.", e));
        initHostScreen();
      } else if (role === 'moderator') {
        document.getElementById('view-moderator').classList.remove('hidden');
      } else if (role === 'player') {
        document.getElementById('view-player').classList.remove('hidden');
        const urlParams = new URLSearchParams(window.location.search);
        const codeFromUrl = urlParams.get('code');
        if (codeFromUrl) document.getElementById('player-room-input').value = codeFromUrl.toUpperCase();
      }
    }

    function showBigPopup(title, subtitle, color) {
      if (!isHost) return;
      const popup = document.getElementById('big-popup');
      const titleEl = document.getElementById('popup-title');
      const subtitleEl = document.getElementById('popup-subtitle');

      titleEl.innerText = title;
      titleEl.style.color = color;
      subtitleEl.innerText = subtitle;

      popup.classList.remove('hidden');
      setTimeout(() => popup.classList.add('show'), 50);
      setTimeout(() => hideBigPopup(), 5000);
    }

    function hideBigPopup() {
      if (!isHost) return;
      const popup = document.getElementById('big-popup');
      if (!popup) return;
      popup.classList.remove('show');
      setTimeout(() => popup.classList.add('hidden'), 300);
    }

    function checkWinConditions() {
      const aliveMafia = state.players.filter(p => p.isAlive && p.isMafia).length;
      const aliveTown = state.players.filter(p => p.isAlive && !p.isMafia && !p.isModerator).length;
      const mafiaPlayer = state.players.find(p => p.isMafia) || {name: 'Unknown'};

      if (aliveMafia === 0) {
        state.announcement = "All Mafia have been eliminated! THE TOWN WINS! 🎉";
        state.phase = 'GAME_OVER';
        showBigPopup("TOWN WINS!", `The Mafia was ${mafiaPlayer.name}!`, "var(--accent-green)");
        return true;
      } else if (aliveMafia >= aliveTown) {
        state.announcement = `The Mafia (${mafiaPlayer.name}) outnumbers the Town! THE MAFIA WINS! 🦹‍♂️`;
        state.phase = 'GAME_OVER';
        showBigPopup("MAFIA WINS!", `${mafiaPlayer.name} was the Mafia!`, "var(--accent-red)");
        return true;
      }
      return false;
    }

    function initHostScreen() {
      roomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
      state.roomCode = roomCode;
      const codeDisplay = document.getElementById('screen-room-code');
      if (codeDisplay) codeDisplay.innerText = roomCode;

      let baseUrl = window.location.href.split('?')[0];
      const currentUrl = baseUrl + '?role=player&code=' + roomCode;
      const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(currentUrl)}&color=0284c7&bgcolor=ffffff`;
      const qrImg = document.getElementById('qr-image');
      if (qrImg) qrImg.src = qrApiUrl;

      updateStatus(`Initializing Server (${roomCode})...`);
      const hostId = `mafia-cd-${roomCode.toLowerCase()}`;
      
      if (peer) {
        try { peer.destroy(); } catch(e) {}
      }

      try {
        peer = new Peer(hostId, peerConfig);
      } catch (err) {
        updateStatus(`🔴 Initialization Error: ${err.message}`);
        return;
      }

      peer.on('open', () => {
        updateStatus(`🟢 Display Screen Online! Room: ${roomCode}`, true);
        render();
      });

      peer.on('connection', (conn) => {
        playerConnections.push(conn);
        conn.on('open', () => { conn.send({ type: 'STATE_UPDATE', state: state }); });
        conn.on('data', (data) => { handleHostIncomingMessage(conn, data); });
        conn.on('close', () => { playerConnections = playerConnections.filter(c => c !== conn); });
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          updateStatus(`⚠️ Code ${roomCode} taken. Generating new code...`);
          setTimeout(initHostScreen, 800);
        } else {
          updateStatus(`🔴 Peer error: [${err.type}] ${err.message}`);
        }
      });
    }

    function handleHostIncomingMessage(conn, msg) {
      if (msg.type === 'JOIN_REQUEST') {
        const existingPlayer = state.players.find(p => p.name.toLowerCase() === msg.player.name.toLowerCase());
        if (existingPlayer) existingPlayer.id = msg.player.id;
        else state.players.push(msg.player);
        broadcastStateToAll();
      } 
      else if (msg.type === 'MAFIA_TARGET') {
        state.mafiaTarget = msg.targetId;
        const targetPlayer = state.players.find(p => p.id === msg.targetId);
        state.announcement = targetPlayer ? `The MAFIA has selected a target!` : "The MAFIA has made a secret choice...";
        broadcastStateToAll();
      } 
      else if (msg.type === 'SUBMIT_VOTE') {
        state.votes[msg.voterId] = msg.targetId;
        broadcastStateToAll();
      } 
      else if (msg.type === 'MOD_ACTION') {
        if (msg.action === 'START_MAFIA_TURN') {
          state.phase = 'NIGHT_MAFIA';
          state.mafiaTarget = null;
          state.votes = {};
          state.announcement = "NIGHT PHASE: The Mafia is choosing a target...";
          showBigPopup("NIGHT FALLS", "The Mafia is making their secret move...", "var(--text-main)");
          broadcastStateToAll();
        } 
        else if (msg.action === 'START_DISCUSSION') {
          if (!state.mafiaTarget) return;
          const target = state.players.find(p => p.id === state.mafiaTarget);
          if (target) {
            target.isAlive = false;
            if (!checkWinConditions()) {
              state.phase = 'DAY_VOTING';
              state.announcement = `${target.name} was eliminated! Discuss and cast your votes.`;
              showBigPopup("DAY BREAK", `${target.name} was taken out during the night. Discussion & Voting has begun!`, "var(--accent-blue)");
            }
          }
          broadcastStateToAll();
        } 
        else if (msg.action === 'TALLY_VOTES') {
          const voteCounts = {};
          Object.values(state.votes).forEach(targetId => { voteCounts[targetId] = (voteCounts[targetId] || 0) + 1; });

          let highestVotes = 0; let eliminatedId = null;
          for (const [targetId, count] of Object.entries(voteCounts)) {
            if (count > highestVotes) { highestVotes = count; eliminatedId = targetId; }
          }

          if (!eliminatedId) return;
          const eliminatedPlayer = state.players.find(p => p.id === eliminatedId);
          if (eliminatedPlayer) eliminatedPlayer.isAlive = false;

          if (!checkWinConditions()) {
            state.announcement = `${eliminatedPlayer ? eliminatedPlayer.name : 'Someone'} was eliminated by vote!`;
            state.phase = 'NIGHT_MAFIA';
            state.mafiaTarget = null;
            state.votes = {};
            showBigPopup("VOTED OUT", `${eliminatedPlayer ? eliminatedPlayer.name : 'Someone'} has been banished by the town!`, "var(--accent-yellow)");
          }
          broadcastStateToAll();
        }
      }
    }

    function broadcastStateToAll() {
      playerConnections.forEach(conn => {
        if (conn.open) conn.send({ type: 'STATE_UPDATE', state: state });
      });
      render();
    }

    function joinGame() {
      const name = document.getElementById('player-name-input').value.trim();
      const inputCode = document.getElementById('player-room-input').value.trim().toUpperCase();

      if (!name || !inputCode) return alert('Please enter both your name and room code.');
      
      const joinBtn = document.getElementById('btn-join');
      joinBtn.disabled = true;
      updateStatus(`Connecting to room ${inputCode}...`);

      localPlayerId = 'p_' + Math.random().toString(36).substr(2, 9);
      const newPlayer = { id: localPlayerId, name: name, isAlive: true, isMafia: false, isModerator: false };

      if (peer) {
        try { peer.destroy(); } catch(e) {}
      }

      try {
        peer = new Peer(peerConfig);
      } catch (err) {
        updateStatus(`🔴 Error: ${err.message}`);
        joinBtn.disabled = false;
        return;
      }

      peer.on('open', () => {
        const targetId = `mafia-cd-${inputCode.toLowerCase()}`;
        hostConnection = peer.connect(targetId, { reliable: true });

        let connectTimeout = setTimeout(() => {
          if (!hostConnection || !hostConnection.open) {
            updateStatus(`🔴 Connection timed out. Check if room code "${inputCode}" is correct.`);
            joinBtn.disabled = false;
          }
        }, 8000);

        hostConnection.on('open', () => {
          clearTimeout(connectTimeout);
          updateStatus(`🟢 Connected to Room ${inputCode}!`, true);
          hostConnection.send({ type: 'JOIN_REQUEST', player: newPlayer });
          document.getElementById('player-login-form').classList.add('hidden');
          document.getElementById('player-active-panel').classList.remove('hidden');
          document.getElementById('player-display-name').innerText = name;
        });

        hostConnection.on('error', (err) => {
          clearTimeout(connectTimeout);
          updateStatus(`🔴 Connection error: ${err.message}`);
          joinBtn.disabled = false;
        });
      });

      peer.on('error', (err) => {
        updateStatus(`🔴 Peer error: [${err.type}] ${err.message}`);
        joinBtn.disabled = false;
      });
    }

    function assignModerator() {
      const select = document.getElementById('mod-select-dropdown');
      const selectedId = select.value;
      if (!selectedId) return alert('Select a Moderator!');

      state.moderatorId = selectedId;
      const eligibleForMafia = state.players.filter(p => p.id !== selectedId);
      if (eligibleForMafia.length < 2) return alert('Need at least 3 players total in the lobby!');

      const mafiaIndex = Math.floor(Math.random() * eligibleForMafia.length);
      state.mafiaId = eligibleForMafia[mafiaIndex].id;

      state.players.forEach(p => {
        p.isModerator = (p.id === state.moderatorId);
        p.isMafia = (p.id === state.mafiaId);
      });

      state.announcement = "Moderator assigned. Waiting for them to start the game...";
      broadcastStateToAll();
    }

    function startMafiaTurn() { if (hostConnection && hostConnection.open) hostConnection.send({ type: 'MOD_ACTION', action: 'START_MAFIA_TURN' }); }
    function startDiscussionPhase() {
      if (!state.mafiaTarget) return alert("Mafia hasn't chosen a target yet!");
      if (hostConnection && hostConnection.open) hostConnection.send({ type: 'MOD_ACTION', action: 'START_DISCUSSION' });
    }
    function tallyVotes() {
      if (Object.keys(state.votes).length === 0) return alert('No votes have been cast yet!');
      if (hostConnection && hostConnection.open) hostConnection.send({ type: 'MOD_ACTION', action: 'TALLY_VOTES' });
    }
    function submitMafiaTarget(targetId) { if (hostConnection && hostConnection.open) hostConnection.send({ type: 'MAFIA_TARGET', targetId: targetId }); }
    function submitVote(targetId) { if (hostConnection && hostConnection.open) hostConnection.send({ type: 'SUBMIT_VOTE', voterId: localPlayerId, targetId: targetId }); }

    function getPhaseDisplayName(phase) {
      switch(phase) {
        case 'LOBBY': return 'Lobby Phase';
        case 'NIGHT_MAFIA': return 'Night Phase (Mafia Action)';
        case 'DAY_VOTING': return 'Day Phase (Discussion & Voting)';
        case 'GAME_OVER': return 'Match Finished';
        default: return phase;
      }
    }

    function render() {
      const localPlayer = state.players.find(p => p.id === localPlayerId);
      if (localPlayer && localPlayer.isModerator && !document.getElementById('view-player').classList.contains('hidden')) {
        switchRole('moderator');
      }

      const playerCountEl = document.getElementById('player-count');
      if (playerCountEl) playerCountEl.innerText = state.players.length;
      
      const screenAnnounceEl = document.getElementById('screen-announcement');
      if (screenAnnounceEl) screenAnnounceEl.innerText = state.announcement;

      const qrBoxContainer = document.getElementById('qr-box-container');
      const displayGameInfo = document.getElementById('display-game-info');
      const screenActionStatus = document.getElementById('screen-action-status');

      if (qrBoxContainer && displayGameInfo) {
        if (state.phase === 'LOBBY') {
          qrBoxContainer.classList.remove('hidden');
          displayGameInfo.classList.add('hidden');
        } else {
          qrBoxContainer.classList.add('hidden');
          displayGameInfo.classList.remove('hidden');
          const currentPhaseDisplay = document.getElementById('current-phase-display');
          if (currentPhaseDisplay) {
            currentPhaseDisplay.innerText = getPhaseDisplayName(state.phase);
            const phaseColor = state.phase === 'NIGHT_MAFIA' ? 'var(--accent-red)' : state.phase === 'DAY_VOTING' ? 'var(--accent-blue)' : 'var(--accent-yellow)';
            currentPhaseDisplay.style.color = phaseColor;
          }

          if (screenActionStatus) {
            if (state.phase === 'NIGHT_MAFIA') {
              screenActionStatus.classList.remove('hidden');
              if (state.mafiaTarget) {
                screenActionStatus.innerText = "✅ The Mafia has made their selection!";
                screenActionStatus.style.background = 'rgba(5, 150, 105, 0.1)';
                screenActionStatus.style.borderColor = 'var(--accent-green)';
                screenActionStatus.style.color = 'var(--accent-green)';
              } else {
                screenActionStatus.innerText = "🌙 Night Phase: Waiting for the Mafia to choose...";
                screenActionStatus.style.background = 'rgba(225, 29, 72, 0.08)';
                screenActionStatus.style.borderColor = 'var(--accent-red)';
                screenActionStatus.style.color = 'var(--accent-red)';
              }
            } else {
              screenActionStatus.classList.add('hidden');
            }
          }
        }
      }

      const screenList = document.getElementById('screen-player-list');
      const modDropdown = document.getElementById('mod-select-dropdown');
      
      if (screenList && modDropdown) {
        screenList.innerHTML = '';
        modDropdown.innerHTML = state.players.length === 0 ? '<option value="">-- Waiting for players... --</option>' : '<option value="">-- Choose Moderator --</option>';

        state.players.forEach(p => {
          const card = document.createElement('div');
          card.className = `player-card ${!p.isAlive ? 'eliminated' : ''}`;
          card.innerText = p.name + (p.isModerator ? ' (MOD)' : '');
          screenList.appendChild(card);

          const opt = document.createElement('option');
          opt.value = p.id; opt.innerText = p.name;
          modDropdown.appendChild(opt);
        });
      }

      if (state.moderatorId) {
        const modSelPanel = document.getElementById('moderator-selection-panel');
        if (modSelPanel) modSelPanel.classList.add('hidden');
      }

      const mafiaPlayer = state.players.find(p => p.isMafia);
      const secretMafiaEl = document.getElementById('secret-mafia-name');
      if (secretMafiaEl) secretMafiaEl.innerText = mafiaPlayer ? mafiaPlayer.name : '[Awaiting Start]';

      const modAnnouncement = document.getElementById('mod-announcement');
      if (modAnnouncement) {
        if (state.phase === 'NIGHT_MAFIA') {
          if (state.mafiaTarget) {
            const selectedTarget = state.players.find(p => p.id === state.mafiaTarget);
            modAnnouncement.innerText = `✅ The Mafia has selected ${selectedTarget ? selectedTarget.name : 'a target'}!`;
            modAnnouncement.style.background = 'rgba(5, 150, 105, 0.1)';
            modAnnouncement.style.borderColor = 'var(--accent-green)';
            modAnnouncement.style.color = 'var(--accent-green)';
          } else {
            modAnnouncement.innerText = `🌙 Night Phase: ${mafiaPlayer ? mafiaPlayer.name : 'The Mafia'} is making their secret choice.`;
            modAnnouncement.style.background = 'rgba(225, 29, 72, 0.08)';
            modAnnouncement.style.borderColor = 'var(--accent-red)';
            modAnnouncement.style.color = 'var(--accent-red)';
          }
        } else if (state.phase === 'DAY_VOTING') {
          modAnnouncement.innerText = `☀️ Day Phase: Discussion & Voting in progress.`;
          modAnnouncement.style.background = 'rgba(2, 132, 199, 0.08)';
          modAnnouncement.style.borderColor = 'var(--accent-blue)';
          modAnnouncement.style.color = 'var(--accent-blue)';
        } else {
          modAnnouncement.innerText = state.announcement;
          modAnnouncement.style.background = '';
          modAnnouncement.style.borderColor = '';
          modAnnouncement.style.color = '';
        }
      }

      const btnStartGame = document.getElementById('btn-start-game');
      const btnStartDiscussion = document.getElementById('btn-start-discussion');
      const btnTallyVotes = document.getElementById('btn-tally-votes');

      if (btnStartGame && btnStartDiscussion && btnTallyVotes) {
        if (state.phase === 'LOBBY' && state.moderatorId) {
          btnStartGame.classList.remove('hidden');
          btnStartDiscussion.classList.add('hidden');
          btnTallyVotes.classList.add('hidden');
        } else if (state.phase === 'NIGHT_MAFIA') {
          btnStartGame.classList.add('hidden');
          btnStartDiscussion.classList.remove('hidden');
          btnTallyVotes.classList.add('hidden');
        } else if (state.phase === 'DAY_VOTING') {
          btnStartGame.classList.add('hidden');
          btnStartDiscussion.classList.add('hidden');
          btnTallyVotes.classList.remove('hidden');
        } else {
          btnStartGame.classList.add('hidden');
          btnStartDiscussion.classList.add('hidden');
          btnTallyVotes.classList.add('hidden');
        }
      }

      const modPlayerList = document.getElementById('mod-player-list');
      if (modPlayerList) {
        modPlayerList.innerHTML = '';
        state.players.forEach(p => {
          const card = document.createElement('div');
          card.className = `player-card ${!p.isAlive ? 'eliminated' : ''}`;
          card.innerText = p.name + (p.isMafia ? ' (Mafia)' : p.isModerator ? ' (Mod)' : ' (Town)');
          modPlayerList.appendChild(card);
        });
      }

      if (localPlayer) {
        const roleBadge = document.getElementById('player-role-badge');
        if (roleBadge) {
          if (localPlayer.isModerator) {
            roleBadge.className = 'badge badge-blue';
            roleBadge.innerText = 'Moderator';
          } else if (localPlayer.isMafia) {
            roleBadge.className = 'badge badge-red';
            roleBadge.innerText = 'Mafia 🦹‍♂️';
          } else {
            roleBadge.className = 'badge badge-green';
            roleBadge.innerText = 'Townsperson 🛡️';
          }
        }

        const playerActionBox = document.getElementById('player-action-box');
        const playerInteractiveOptions = document.getElementById('player-interactive-options');

        if (playerActionBox && playerInteractiveOptions) {
          playerInteractiveOptions.innerHTML = '';

          if (!localPlayer.isAlive) {
            playerActionBox.innerText = "You have been eliminated from the game.";
            playerActionBox.style.background = 'rgba(225, 29, 72, 0.1)';
            playerActionBox.style.color = 'var(--accent-red)';
          } else if (state.phase === 'LOBBY') {
            playerActionBox.innerText = "Waiting for the Moderator to start the game...";
            playerActionBox.style.background = '';
            playerActionBox.style.color = '';
          } else if (state.phase === 'NIGHT_MAFIA') {
            if (localPlayer.isMafia) {
              playerActionBox.innerText = "🌙 CHOOSE YOUR TARGET TO ELIMINATE:";
              state.players.filter(p => p.isAlive && p.id !== localPlayer.id).forEach(p => {
                const btn = document.createElement('button');
                btn.className = 'btn-danger';
                btn.innerText = `Eliminate ${p.name}`;
                btn.onclick = () => {
                  submitMafiaTarget(p.id);
                  alert(`Target selected: ${p.name}`);
                };
                playerInteractiveOptions.appendChild(btn);
              });
            } else {
              playerActionBox.innerText = "🌙 Night has fallen. Close your eyes and wait...";
            }
          } else if (state.phase === 'DAY_VOTING') {
            playerActionBox.innerText = "☀️ Cast your vote on who you suspect is the Mafia:";
            state.players.filter(p => p.isAlive && p.id !== localPlayer.id && !p.isModerator).forEach(p => {
              const btn = document.createElement('button');
              btn.className = 'btn-alt';
              btn.innerText = `Vote for ${p.name}`;
              btn.onclick = () => {
                submitVote(p.id);
                alert(`Vote cast for: ${p.name}`);
              };
              playerInteractiveOptions.appendChild(btn);
            });
          } else {
            playerActionBox.innerText = state.announcement;
          }
        }
      }
    }
  </script>
